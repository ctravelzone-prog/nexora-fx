<!DOCTYPE html>
<!-- Nexora FX - user site entry point. The app is a single-page app: this
     file only provides the shell, and js/app.js renders every page into #app. -->
<html lang="en">
<head>
  <!-- Head: meta, title, favicon, fonts, Tailwind config, stylesheets. -->
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <title>Nexora Fx — Copy Trading Platform</title>
  <link rel="preload" as="image" href="/assets/hero-trading.webp" type="image/webp" fetchpriority="high">
  <link rel="icon" href="/assets/favicon.ico">
  <link rel="apple-touch-icon" href="/assets/apple-touch-icon.png">
  <link rel="manifest" href="/manifest.json">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
  <!-- Tailwind CSS (CDN). Brand colors are set below: orange #FF6A00 and dark #1E2329. -->
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      theme: {
        extend: {
          colors: {
            orange: { DEFAULT: '#FF6A00', 500: '#FF6A00', 600: '#FF7A00', 400: '#FF8C33' },
            dark: { DEFAULT: '#1E2329', 800: '#181A20', 900: '#0F1015' },
          },
          fontFamily: { sans: ['Inter', 'ui-sans-serif', 'system-ui'] },
          borderRadius: { xl: '14px', '2xl': '16px', '3xl': '20px' }
        }
      }
    }
  </script>
  <!-- App stylesheets, loaded in this order (later files override earlier ones). -->
  <link rel="stylesheet" href="/css/app.css">
  <link rel="stylesheet" href="/css/responsive.css">
  <link rel="stylesheet" href="/css/nexora-theme.css">
  <link rel="stylesheet" href="/css/nexora-theme2.css">
</head>
<body class="bg-[#F8F9FA] font-sans text-[#0F172A] min-h-screen">
  <!-- App mount points: #app is rendered by js/app.js, #modal-root holds
       dialogs (utils.showModal), #toast-root holds popup messages. -->
  <div id="app"></div>
  <div id="modal-root"></div>
  <div id="toast-root" class="fixed bottom-4 right-4 z-50 flex flex-col gap-2 max-w-sm"></div>
<!-- Scripts, in load order: API clients and helpers first, then shared
       components and templates, then the router (app.js), then the page
       handlers in js/pages/. The ?v=v119 cache version must be bumped on
       every release or browsers keep serving stale code. -->
  <script src="/js/api.js?v=v119"></script>
  <script src="/js/admin-api.js?v=v119"></script>
  <script src="/js/utils.js?v=v119"></script>
  <script src="/js/components.js?v=v119"></script>
  <script src="/js/components2.js?v=v119"></script>
  <script src="/js/templates.js?v=v119"></script>
  <script src="/js/app.js?v=v119"></script>
  <script src="/js/pages/landing.js?v=v119"></script>
  <script src="/js/pages/auth.js?v=v119"></script>
  <script src="/js/pages/dashboard.js?v=v119"></script>
  <script src="/js/pages/dashboard-html.js?v=v119"></script>
  <script src="/js/pages/dashboard-html2.js?v=v119"></script>
  <script src="/js/pages/dashboard-chart.js?v=v119"></script>
  <script src="/js/pages/copyTrade.js?v=v119"></script>
  <script src="/js/pages/myCopies.js?v=v119"></script>
  <script src="/js/pages/deposit.js?v=v119"></script>
  <script src="/js/pages/withdraw.js?v=v119"></script>
  <script src="/js/pages/requestMoney.js?v=v119"></script>
  <script src="/js/pages/history.js?v=v119"></script>
  <script src="/js/pages/history2.js?v=v119"></script>
  <script src="/js/pages/referral.js?v=v119"></script>
  <script src="/js/pages/news.js?v=v119"></script>
  <script src="/js/pages/schedule.js?v=v119"></script>
  <script src="/js/pages/promotion.js?v=v119"></script>
  <script src="/js/pages/support.js?v=v119"></script>
  <script src="/js/pages/profile.js?v=v119"></script>
  <script src="/js/pages/kyc.js?v=v119"></script>
  <script src="/js/pages/notifications.js?v=v119"></script>
  <script src="/js/pages/twofa-and-terms.js?v=v119"></script>
</body>
</html>
