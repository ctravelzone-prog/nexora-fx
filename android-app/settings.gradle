// Nexora FX Android app — project settings.
// This is a WebView wrapper: the app opens the Nexora FX website inside
// a native Android shell (no separate app code for trading features).
pluginManagement {
    repositories {
        google()
        mavenCentral()
        gradlePluginPortal()
    }
}
dependencyResolutionManagement {
    repositoriesMode.set(RepositoriesMode.FAIL_ON_PROJECT_REPOS)
    repositories {
        google()
        mavenCentral()
    }
}
rootProject.name = "Nexora FX"
include ':app'
